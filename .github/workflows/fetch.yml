name: fetch-assets
on:
  push:
    branches: [asset-fetch]
    paths: [urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p fetched
          while read -r name url; do curl -sSL -A "Mozilla/5.0" -o "fetched/$name" "$url"; done < urls.txt
          ls -la fetched
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add fetched && git commit -m "Fetched assets" && git push
